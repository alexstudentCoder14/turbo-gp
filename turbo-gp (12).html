<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo GP</title>
<style>
:root{--bg:#0a0c14;--p1:#161b2b;--p2:#1f263b;--line:#2f3a58;--red:#e10600;--gold:#ffd54a;--mut:#9aa6c3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
h1,h2,h3,p{margin:0}
button{font:inherit;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(#f0291d,#c10a02);border:0;border-radius:12px;padding:12px 22px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.4);transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.12)}button:active{transform:translateY(2px);box-shadow:none}
button.df,.top button{background:var(--p2);border:1px solid var(--line);box-shadow:none;padding:10px 18px;font-size:15px}
button.df.on{background:var(--red);border-color:var(--red)}
select,input{font:inherit;font-size:16px;color:#fff;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;user-select:text;-webkit-user-select:text}
input::placeholder{color:#7b86a3}
small{color:var(--mut);font-size:13px}
/* in-race */
#div{position:fixed;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:#000;display:none}
.hud{position:fixed;top:10px;left:14px;font-weight:700;font-size:18px;line-height:1.4;text-shadow:0 2px 4px #000;pointer-events:none;display:none}
#big{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:96px;font-weight:900;text-shadow:0 4px 12px #000;pointer-events:none}
#touch{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none}
.tbox{position:absolute;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;pointer-events:none}
.tl,.tr{display:flex;gap:8px;align-items:flex-end}
.tbox b{pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;min-width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5);font-size:22px}
.tbox b.on{background:rgba(255,255,255,.6)}
.tbox b.go{background:rgba(40,200,80,.4);height:74px;min-width:74px}
.tbox b.bo{background:rgba(255,160,0,.4);font-size:13px;border-radius:30px;padding:0 8px}
#mb{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:none;padding:4px 14px;background:rgba(0,0,0,.55);border-radius:8px;z-index:5;cursor:pointer;font-size:18px}
#lb{position:fixed;top:10px;right:10px;background:rgba(0,0,0,.55);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.55;display:none;pointer-events:none;min-width:150px}
.lh{font-size:11px;opacity:.75;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.lr{display:flex;gap:8px;align-items:center;padding:0 5px;border-left:3px solid transparent;border-radius:4px}
.lr.me{background:rgba(255,255,255,.28);font-weight:800}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
#toast{position:fixed;top:16%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 3px 8px #000;pointer-events:none;opacity:0;transition:opacity .3s;z-index:30}
/* main menu + results */
#menu,#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 16px;text-align:center;overflow-y:auto;touch-action:pan-y;background:radial-gradient(circle at 50% 0,#1c2646,var(--bg) 70%)}
#end{display:none;background:rgba(10,12,20,.95)}
#menu>*,#end>*{flex-shrink:0}
#menu>:first-child,#end>:first-child{margin-top:auto}#menu>:last-child,#end>:last-child{margin-bottom:auto}
.title{font-size:clamp(36px,9vh,66px);line-height:1;letter-spacing:3px;font-weight:900}.title span{color:var(--red)}
#live,#tick,#rival{font-size:14px;min-height:18px;color:var(--mut)}#rival{color:#ff9d5c}
.who{display:flex;gap:12px;align-items:center}#coin{font-size:24px;font-weight:800;color:var(--gold)}
button.big.alt{background:linear-gradient(#3a86ff,#1b52c8);box-shadow:0 5px 0 #0f2f7a}
button.big{width:min(94vw,720px);font-size:28px;min-height:66px;letter-spacing:2px;box-shadow:0 5px 0 #7d0500}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:min(94vw,720px)}
.mgrid button{position:relative;flex-direction:column;gap:6px;background:var(--p1);border:1px solid var(--line);box-shadow:none;font-size:15px;min-height:88px;padding:12px 8px}
.mgrid i{font-style:normal;font-size:28px;line-height:1}
.badge{position:absolute;top:8px;right:10px;background:var(--red);border-radius:12px;padding:1px 9px;font-size:14px}.badge:empty{display:none}
/* pages */
.ov{position:fixed;inset:0;background:var(--bg);display:none;overflow-y:auto;z-index:20;padding:16px;touch-action:pan-y}
.wrap{max-width:920px;margin:0 auto;padding-bottom:40px}
.top{display:flex;align-items:center;gap:14px;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.top h2{flex:1;font-size:24px}
.wrap h3{margin:26px 0 12px;font-size:18px}.wrap p{margin:12px 0}
.row,.tabs{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0;align-items:center}
.hint{color:var(--mut);font-size:14px;line-height:1.55}
.coins{font-size:22px;font-weight:800;color:var(--gold)}
.stats{margin:14px 0;color:var(--mut);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--p1);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center}
.card.eq{border-color:var(--gold);background:#27261a}
.card button{font-size:14px;padding:8px 14px;min-height:40px}
.sw{width:46px;height:46px;border-radius:50%;border:2px solid #fff6}
.pips{display:flex;gap:6px}.pips i{width:26px;height:10px;border-radius:5px;background:#333}.pips i.f{background:var(--gold)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;background:linear-gradient(#3b2614,#2a1a0d);padding:14px;border-radius:14px;border:4px solid #5a3a1e}
.tro{background:#0006;border-radius:12px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;border-bottom:5px solid #6b4423}
.tro .ico{font-size:46px;filter:drop-shadow(0 0 8px var(--gold))}
.tro.lock{opacity:.5}.tro.lock .ico{filter:grayscale(1)}
.hub{display:flex;flex-direction:column;gap:12px;width:100%}
.hc{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;text-align:left;font-size:15px}
.hc button{font-size:14px;padding:8px 14px;min-height:40px}
.qrow{display:flex;gap:10px;justify-content:space-between;width:100%;align-items:center;font-size:14px}
.brow{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:8px 0;flex-wrap:wrap;border-radius:12px;background:var(--p1);border:1px solid var(--line)}
.brow.me{background:#3f3416;border-color:var(--gold)}
.brow .nm{flex:1;min-width:140px;line-height:1.5;text-align:left}.brow button{min-height:40px;padding:8px 14px;font-size:14px}
.pick{display:flex;align-items:center;gap:14px;justify-content:center;margin:12px 0}.pc{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.pal{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.pi{flex-direction:column;gap:2px;min-width:78px;padding:8px;background:var(--p1);border:2px solid var(--line);box-shadow:none;font-size:26px;touch-action:none}
.pi small{font-size:12px}.pi.on{border-color:var(--gold);background:#27261a}
.ghost{position:fixed;font-size:36px;pointer-events:none;transform:translate(-50%,-50%);z-index:50}
@media (max-height:620px){#menu{gap:10px;padding:12px}.title{font-size:34px}button.big{min-height:54px;font-size:24px}.mgrid button{min-height:70px}.mgrid i{font-size:22px}}
</style></head><body>
<div id="div"></div>
<div class="hud" id="h0"></div><div class="hud" id="h1"></div>
<div id="big"></div><div id="touch"></div><div id="lb"></div><div id="mb" onclick="toMenu()">&#9776;</div>
<div id="menu">
  <h1 class="title">TURBO <span>GP</span></h1>
  <div id="live"></div><div id="tick"></div><div id="rival"></div>
  <div class="who"><span id="coin"></span><input id="nm" maxlength="14" placeholder="Racer name" onchange="setName(this.value)"></div>
  <button class="big" onclick="openPlay()">&#9654; PLAY</button>
  <button class="big alt" onclick="openMP()">&#127760; ONLINE MULTIPLAYER</button>
  <div class="mgrid">
    <button onclick="openShop()"><i>&#128722;</i>Garage Shop</button>
    <button onclick="openCab()"><i>&#127942;</i>Trophy Cabinet</button>
    <button onclick="openBoard()"><i>&#127757;</i>Leaderboards</button>
    <button onclick="openDaily()"><i>&#127873;</i>Daily Rewards<span id="dbadge" class="badge"></span></button>
    <button onclick="openTimes()"><i>&#9201;</i>Race Times</button>
    <button onclick="openMine()"><i>&#128193;</i>My Courses</button>
    <button onclick="openCrt()"><i>&#128736;</i>Create Course</button>
    <button onclick="openComm()"><i>&#128101;</i>Community Courses</button>
  </div>
</div>
<div class="ov" id="play"><div class="wrap">
  <div class="top"><h2>&#9654; Play</h2><button onclick="closeOv()">&larr; Back</button></div>
  <h3>1. Choose a track</h3>
  <div class="pick"><button class="df" onclick="pickMap(-1)">&#9664;</button>
    <div class="pc"><canvas id="mp" width="220" height="130" style="border-radius:10px;width:220px;height:130px"></canvas><div id="mn" style="font-weight:800;font-size:20px"></div><div id="md" style="opacity:.75;font-size:14px"></div></div>
    <button class="df" onclick="pickMap(1)">&#9654;</button></div>
  <h3>2. AI difficulty</h3>
  <div class="row"><button class="df" id="d0" onclick="setDiff(0)">Easy</button><button class="df on" id="d1" onclick="setDiff(1)">Normal</button><button class="df" id="d2" onclick="setDiff(2)">Hard</button></div>
  <h3>3. Start the race</h3>
  <div class="row"><button onclick="startGame(1)">1 Player vs AI</button><button onclick="startGame(2)">2 Players (split screen)</button></div>
  <p class="hint">1 Player: Arrow keys or W A S D, boost = Shift.<br>2 Players: P1 = W A S D + Left Shift, P2 = Arrow keys + Right Shift.<br>Esc = back to menu.</p>
  <button id="tt" class="df" onclick="toggleTouch()"></button>
</div></div>
<div class="ov" id="daily"><div class="wrap">
  <div class="top"><h2>&#127873; Daily Rewards</h2><button onclick="closeOv()">&larr; Back</button></div>
  <div class="hub" id="hub"></div>
</div></div>
<div id="end"><h1 style="margin:0">Race finished</h1><div id="res" style="font-size:22px;line-height:1.6"></div><div id="rw" style="font-size:20px;color:#ffd54a;line-height:1.5"></div>
  <button onclick="startGame(mode)">Race again</button><button onclick="openShop()" class="df">&#128722; Shop</button><button id="lobbyBtn" class="df" style="display:none" onclick="openMP()">&#127760; Lobby</button><button onclick="toMenu()" style="background:#333">Menu</button></div>
<div id="toast"></div><div class="ov" id="shop"></div><div class="ov" id="cab"></div><div class="ov" id="board"></div><div class="ov" id="crt"></div><div class="ov" id="comm"></div><div class="ov" id="mpo"></div><div class="ov" id="mine"></div><div class="ov" id="times"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

 {name:'Sunny Park GP',desc:'Fast flowing classic',sky:0x87ceeb,gnd:0x3f8f3f,hg:0x446644,hi:.95,fog:[90,420],road:[0x3a3a42,0x33333a],curb:[0xdd1111,0xffffff],scn:'pine',ramps:[50,130,220],

 {name:'Pirate Cove GP',desc:'Sandy coves, barrels and a shipwreck hull',sky:0x6ec6ff,gnd:0xe3b94d,hg:0x2a6f9a,hi:1.05,fog:[100,480],road:[0x5a4632,0x52402d],curb:[0xc0392b,0xf5f5f5],scn:'pirate',ramps:[45,125,205],

  mapIdx=mi2;MP.racing=true;MP.rx={};MP.ls=0;hideOv();startGame(1,{slots:p.slots.slice(0,MPMAX),peers:MP.peers})}
function mpSend(){if(!MP)return;const me=cars.find(c=>c.pl);if(!me)return;const now=performance.now(),n=Object.keys(MP.peers).length+1;if(now-MP.ls<Math.max(100,n*75))return;MP.ls=now;
  try{MP.ch.send({type:'broadcast',event:'pos',payload:{i:sv.pid,x:+me.x.toFixed(1),z:+me.z.toFixed(1),y:+me.y.toFixed(2),h:+me.h.toFixed(3),s:+me.s.toFixed(1),l:me.lap,d:me.idx,b:me.bon?1:0,f:me.fin?1:0,t:me.fin?Math.round(me.ft-raceT0):0}})}catch(e){}}
function mpStep(c,dt){const r=MP&&MP.rx[c.rid];if(r){const age=Math.min(.4,(performance.now()-r.at)/1000),tx=r.x+Math.sin(r.h)*r.s*age,tz=r.z+Math.cos(r.h)*r.s*age,k=Math.min(1,10*dt);
    c.x+=(tx-c.x)*k;c.z+=(tz-c.z)*k;c.y+=(r.y-c.y)*k;c.h+=ad(r.h,c.h)*k;c.s=r.s;c.lap=r.l;c.idx=r.d;c.prog=c.lap*N+c.idx;c.bon=!!r.b;
    if(r.f&&!c.fin){c.fin=true;c.ft=raceT0+r.t}}
  c.m.position.set(c.x,c.y,c.z);c.m.rotation.y=c.h;const fl=c.m.userData.fl;if(fl){fl.visible=!!c.bon;fl.scale.y=.8+Math.random()*.5}}
function renderMP(){const el=$('mpo');

function mpList(){const L=$('mplist');if(!MP||!L||$('mpo').style.display!='block')return;const ids=Object.keys(MP.peers).concat(sv.pid).sort(),host=ids[0]==sv.pid;

sv.custom.forEach(c=>addCustom(c));
// ---- cars
function mkCar(col,o={}){const g=new THREE.Group();g.rotation.order='YXZ';
  const add=(geo,c,x,y,z)=>{const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);g.add(m);return m};
  add(new THREE.BoxGeometry(1.2,.45,3),col,0,.55,0);
  add(new THREE.BoxGeometry(.6,.3,1.8),col,0,.45,2.3);
  add(new THREE.BoxGeometry(2.3,.1,.6),o.wg??0x111111,0,.25,3.1);
  {const ws=o.sp||0,wgc=o.wg??0x111111,bx=(w,h)=>new THREE.BoxGeometry(w,h,.12);
    if(ws==0)add(bx(1.9,.5),wgc,0,1.25,-1.8);else if(ws==1)add(bx(1.9,.95),wgc,0,1.45,-1.8);else if(ws==2)add(bx(2.7,.5),wgc,0,1.25,-1.8);else{add(bx(1.9,.4),wgc,0,1.1,-1.8);add(bx(1.9,.4),wgc,0,1.65,-1.8)}}
  add(new THREE.BoxGeometry(.12,.6,.12),0x111111,0,.9,-1.7);
  add(new THREE.SphereGeometry(.28,10,8),o.h??0xffffff,0,.95,.2);
  for(const [x,z,r] of [[-1.1,1.7,.42],[1.1,1.7,.42],[-1.15,-1.5,.5],[1.15,-1.5,.5]]){const w=add(new THREE.CylinderGeometry(r,r,.55,14),o.wc??0x151515,x,r,z);w.rotation.z=Math.PI/2}
  if(o.s!=null)add(new THREE.BoxGeometry(.3,.02,3.02),o.s,0,.78,0);
  if(o.u!=null){const ug=new THREE.Mesh(new THREE.BoxGeometry(2.6,.03,5.4),new THREE.MeshBasicMaterial({color:o.u,transparent:true,opacity:.55}));ug.position.set(0,.05,0);g.add(ug)}
  if(o.n){const cv=document.createElement('canvas');cv.width=cv.height=96;const x=cv.getContext('2d');x.fillStyle='#fff';x.beginPath();x.arc(48,48,45,0,7);x.fill();x.lineWidth=6;x.strokeStyle='#111';x.stroke();x.fillStyle='#111';x.font='bold '+(o.n>9?44:58)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(o.n,48,52);
    const tx=new THREE.CanvasTexture(cv),mt=()=>new THREE.MeshBasicMaterial({map:tx,transparent:true}),wy=o.sp==1?1.45:o.sp==3?1.4:1.25;
    const pl=(sz,px,py,pz,ry)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(sz,sz),mt());m.position.set(px,py,pz);m.rotation.y=ry;g.add(m)};
    pl(1.5,0,wy,-1.9,Math.PI);pl(1.1,-.63,.6,.2,-Math.PI/2);pl(1.1,.63,.6,.2,Math.PI/2);
    const t2=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.4),mt());t2.rotation.x=-Math.PI/2;t2.rotation.z=Math.PI;t2.position.set(0,.82,-.45);g.add(t2)}
  const fl=add(new THREE.ConeGeometry(.28,1.8,8),o.f??0xff8800,0,.6,-2.9);fl.rotation.x=-Math.PI/2;fl.visible=false;g.userData.fl=fl;
  return g}
const cars=[];
function startGame(m,mp){mode=m;cars.forEach(c=>S.remove(c.m));cars.length=0;buildTrack(mapIdx);
  rollDq();
  const pc=i=>PAINTS[sv.eq[i].p][1],lk=i=>{const e=sv.eq[i];return{wc:WHEELS[e.w][1],wg:WINGS[e.wg][1],h:HELMS[e.h][1],s:STRIPES[e.s][1],f:FLAMES[e.f][1],u:null,sp:WSTYLE[e.sp][1],n:NUMS[e.n][1]}},hum=m==1?[pc(0)]:[pc(0),pc(1)],ai=AIC.filter(c=>!hum.includes(c));
  const cfg0=m==1?[[1,pc(0),'P1',lk(0)],[0,ai[0],'AI 1'],[0,ai[1],'AI 2'],[0,ai[2],'AI 3'],[0,ai[3],'AI 4']]:[[1,pc(0),'P1',lk(0)],[2,pc(1),'P2',lk(1)],[0,ai[0],'AI 1'],[0,ai[1],'AI 2'],[0,ai[2],'AI 3']];
  const cfg=mp?mp.slots.map(id=>{if(id==sv.pid)return[1,pc(0),sv.name,lk(0)];const pe=mp.peers[id]||{look:cleanLook(null)};return[0,pe.look.col,pe.name||'Racer',pe.look,id]}):cfg0;
  cfg.forEach(([pl,col,name,wc,rid],k)=>{const i=(N-(3+(k>>1)*3))%N,p=C[i],lat=(k&1)?3.5:-3.5;
    const U=pl?sv.up:{eng:0,tyre:0,boost:0},c={pl,rid,name,col,m:mkCar(col,wc||{}),em:1+.03*U.eng,sm:1+.07*U.tyre,bd:1-.12*U.boost,br:1+.25*U.boost,airT:0,mg:false,x:p.x+p.nx*lat,z:p.z+p.nz*lat,h:p.an,s:0,y:0,vy:0,gnd:0,air:false,idx:i,lap:0,d:0,fin:false,ft:0,prog:0,pt:0,cy:3.6,boost:1,bon:false,
      skill:pl?1:DF[diff][0]+Math.random()*DF[diff][1],off:(Math.random()-.5)*8};
    c.ch=c.h;S.add(c.m);cars.push(c)});
  hideOv();$('menu').style.display='none';$('end').style.display='none';
  $('h0').style.display='block';$('h1').style.display=m==2?'block':'none';$('h1').style.left='calc(50% + 14px)';
  $('div').style.display=m==2?'block':'none';
  cd=3.4;state='count';$('mb').style.display='block';$('lb').style.display='block';buildTouch()}
function toMenu(){state='menu';if(MP)MP.racing=false;hideOv();$('menu').style.display='flex';$('end').style.display='none';$('big').textContent='';
  $('h0').style.display=$('h1').style.display=$('div').style.display=$('mb').style.display=$('lb').style.display='none';$('touch').innerHTML='';refreshMenu()}

// ---- touch
const tch=[{},{}];let touchOn=matchMedia('(pointer:coarse)').matches;
function toggleTouch(){touchOn=!touchOn;$('tt').textContent='Touch controls: '+(touchOn?'ON':'OFF')}
toggleTouch();toggleTouch();
function buildTouch(){const el=$('touch');el.innerHTML='';tch[0]={};tch[1]={};if(!touchOn)return;
  const n=mode==2?2:1;
  for(let i=0;i<n;i++){const box=document.createElement('div');box.className='tbox';box.style.left=(i*100/n)+'%';box.style.width=(100/n)+'%';
    box.innerHTML='<div class="tl"><b data-k="l">&#9664;</b><b data-k="r">&#9654;</b></div><div class="tr"><b data-k="b" class="bo">BOOST</b><b data-k="d">&#9660;</b><b data-k="u" class="go">&#9650;</b></div>';
    box.querySelectorAll('b').forEach(b=>{const k=b.dataset.k;
      b.addEventListener('pointerdown',e=>{e.preventDefault();tch[i][k]=1;b.classList.add('on')});
      ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{tch[i][k]=0;b.classList.remove('on')}));
      b.addEventListener('contextmenu',e=>e.preventDefault())});
    el.appendChild(box)}}
// ---- input
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();if(e.code=='Escape')toMenu()});
addEventListener('keyup',e=>keys[e.code]=0);
function input(c){const k=keys,one=mode==1,T=tch[c.pl-1]||{};let u,d,l,r,b;
  if(c.pl==1){u=k.KeyW||(one&&k.ArrowUp);d=k.KeyS||(one&&k.ArrowDown);l=k.KeyA||(one&&k.ArrowLeft);r=k.KeyD||(one&&k.ArrowRight);b=k.ShiftLeft||(one&&k.ShiftRight)}
  else{u=k.ArrowUp;d=k.ArrowDown;l=k.ArrowLeft;r=k.ArrowRight;b=k.ShiftRight}
  return{t:(u||T.u?1:0)-(d||T.d?1:0),s:(l||T.l?1:0)-(r||T.r?1:0),b:b||T.b}}
function aiIn(c){const hp=cars.reduce((m2,x)=>x.pl?Math.max(m2,x.prog):m2,0);c.rb=hp-c.prog>12?[1.02,1.05,1.1][diff]:1;const tg=C[(c.idx+8)%N],tx=tg.x+tg.nx*c.off,tz=tg.z+tg.nz*c.off,a=ad(Math.atan2(tx-c.x,tz-c.z),c.h);
  const want=Math.max(28,MAX*(c.fin?.5:c.skill)*(c.rb||1)*(1-C[c.idx].ca*.6));
  return{t:c.s<want?1:(c.s>want+8?-.6:0),s:Math.max(-1,Math.min(1,a*2.5)),b:diff==2&&c.boost>.25&&C[c.idx].ca<.1&&c.s>40}}

// ---- physics
function phys(c,dt,t,st,bo){
  c.stv=(c.stv||0)+(st-(c.stv||0))*Math.min(1,10*dt);st=c.stv;
  if(c.pl){let inn=false;for(const q of LD){const dx=c.x-q.x,dz=c.z-q.z,u=dx*q.tx+dz*q.tz;if(u>0&&u<q.len&&Math.abs(dx*q.nx+dz*q.nz)<12){inn=true;break}}if(inn&&!c.lmIn)sv.stats.lm++;c.lmIn=inn}
  const off=Math.abs(c.d)>W/2;
  let bst=false;
  if(!c.air){
    for(const q of PD){const dx=c.x-q.x,dz=c.z-q.z;if(Math.abs(dx*q.tx+dz*q.tz)<5&&Math.abs(dx*q.nx+dz*q.nz)<6){if(c.pl&&!(c.pad>0))sv.stats.pads++;c.pad=1;break}}if(c.pad>0)c.pad-=dt;
    if(bo&&c.boost>0&&t>=0&&!c.fin){bst=true;t=1;c.boost=Math.max(0,c.boost-.3*c.bd*dt);if(c.pl){sv.dq.p.boost=(sv.dq.p.boost||0)+dt;sv.stats.bs+=dt}}else if(c.pad>0&&t>=0){bst=true;t=1}
    const cap=(off?34:MAX)*(c.fin?.5:c.skill)*(bst?1.3:1)*c.em*(c.rb||1);
    if(t>0){if(c.s<cap)c.s+=ACC*c.em*t*dt*(bst?2.2:1)}else if(t<0)c.s-=(c.s>1?75:22)*(-t)*dt;
    if(c.s<-14)c.s=-14;
    c.s-=c.s*.12*dt;if(c.s>cap)c.s-=(c.s-cap)*Math.min(1,2.5*dt);
    c.h+=st*2.2*c.sm*dt*Math.min(1,Math.abs(c.s)/10)/(1+Math.abs(c.s)/70)*(c.s<0?-1:1)}
  else{c.h+=st*1.6*c.sm*dt;if(Math.abs(st)<.08)c.h+=ad(C[c.idx].an,c.h)*Math.min(1,1.3*dt)}
  c.bon=bst;if(!bst)c.boost=Math.min(1,c.boost+.1*c.br*dt);
  const ox=c.x,oz=c.z;c.x+=Math.sin(c.h)*c.s*dt;c.z+=Math.cos(c.h)*c.s*dt;
  // vertical / ramps
  let ng=gh(c.x,c.z);if(!c.air&&ng-c.gnd>1.5){c.x=ox;c.z=oz;c.s*=-.25;ng=gh(c.x,c.z)}
  if(!c.air){if(c.gnd-ng>.6){c.air=true;c.airT=0;c.mg=c.gnd>6}else{c.vy=Math.min(40,(ng-c.gnd)/dt);c.y=ng}}
  if(c.air){c.vy-=G*dt;c.y+=c.vy*dt;c.airT+=dt;if(c.y<=ng){c.y=ng;c.vy=0;c.air=false;if(c.pl&&state=='race'&&!c.fin)landed(c);c.airT=0}}
  c.gnd=ng;
  // track position
  let best=1e9,bi=c.idx;
  for(let j=-20;j<=20;j++){const i=(c.idx+j+N)%N,p=C[i],d=(c.x-p.x)**2+(c.z-p.z)**2;if(d<best){best=d;bi=i}}
  if(c.idx>N*.75&&bi<N*.25)c.lap++;else if(c.idx<N*.25&&bi>N*.75)c.lap--;
  c.idx=bi;const p=C[bi];c.d=(c.x-p.x)*p.nx+(c.z-p.z)*p.nz;
  const lim=W/2+6;
  if(Math.abs(c.d)>lim){const e=c.d-Math.sign(c.d)*lim;c.x-=p.nx*e;c.z-=p.nz*e;c.d-=e;c.h+=ad(p.an,c.h)*Math.min(1,7*dt);c.s*=1-1.5*dt}
  c.prog=c.lap*N+c.idx;
  if(c.lap>LAPS&&!c.fin){c.fin=true;c.ft=performance.now()}
  const tgt=-Math.atan2(c.vy,Math.max(Math.abs(c.s),8));c.pt+=(tgt-c.pt)*Math.min(1,10*dt);
  c.m.position.set(c.x,c.y,c.z);c.m.rotation.y=c.h;c.m.rotation.x=c.pt;const fl=c.m.userData.fl;if(fl){fl.visible=!!c.bon;fl.scale.y=.8+Math.random()*.5}}
const lab=c=>c.pl?(mode==1?'YOU':c.name):c.name;
function lbUpd(rk){$('lb').innerHTML='<div class="lh">'+MAPS[mapIdx].name+'</div>'+rk.map((c,i)=>`<div class="lr${c.pl?' me':''}"${c.pl?` style="border-left-color:${hx(c.col)}"`:''}><span>${i+1}</span><span class="dot" style="background:${hx(c.col)}"></span><span style="flex:1">${lab(c)}${c.pl?' &#9664;':''}</span><span>${c.fin?'FIN':'L'+Math.min(LAPS,Math.max(1,c.lap))}</span></div>`).join('')}
function rank(){return cars.slice().sort((a,b)=>(a.fin&&b.fin)?a.ft-b.ft:a.fin?-1:b.fin?1:b.prog-a.prog)}

function updCam(c,cm,dt,aspect){
  c.ch+=ad(c.h,c.ch)*Math.min(1,5*dt);
  const fx=Math.sin(c.ch),fz=Math.cos(c.ch);
  c.cy+=(c.y*.75+3.6-c.cy)*Math.min(1,6*dt);
  cm.position.set(c.x-fx*9,c.cy,c.z-fz*9);
  cm.lookAt(c.x+fx*8,c.y*.8+1,c.z+fz*8);
  cm.fov=64+Math.abs(c.s)*.1;cm.aspect=aspect;cm.updateProjectionMatrix()}

// ---- main loop
const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(.05,clock.getDelta());
  if(state=='menu'||!cars.length)return;
  if(state=='count'){cd-=dt;const n=Math.ceil(cd-.4);
    if(n>0)$('big').textContent=n;else{$('big').textContent='GO!';state='race';raceT0=performance.now();cars.forEach(c=>{if(c.pl&&sv.up.start)c.pad=.4+.4*sv.up.start});setTimeout(()=>{if(state!='menu')$('big').textContent=''},900)}}
  const live=state=='race'||state=='end';
  for(const c of cars){if(c.rid){mpStep(c,dt);continue}let t=0,s=0,b=0;if(live){const q=(c.fin||!c.pl)?aiIn(c):input(c);t=q.t;s=q.s;b=q.b}phys(c,dt,t,s,b)}
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<2.4&&d>.001&&Math.abs(a.y-b.y)<1.2){const o=2.4-d,nx=dx/d,nz=dz/d;if(!a.rid){const w=b.rid?1:.5;a.x-=nx*o*w;a.z-=nz*o*w;a.s*=.99}if(!b.rid){const w=a.rid?1:.5;b.x+=nx*o*w;b.z+=nz*o*w;b.s*=.99}}}
  const hs=cars.filter(c=>c.pl),w=innerWidth,h=innerHeight,rk=rank();
  R.setScissorTest(true);
  hs.forEach((c,i)=>{const vw=hs.length==2?w/2:w,vx=i*vw;updCam(c,cams[i],dt,vw/h);
    R.setViewport(vx,0,vw,h);R.setScissor(vx,0,vw,h);R.render(S,cams[i]);
    const p=rk.indexOf(c);
    $('h'+i).innerHTML=c.fin?`${c.name}<br>FINISHED ${ord[p]}`:`${c.name}<br>LAP ${Math.max(1,c.lap)}/${LAPS}<br>${ord[p]} / ${cars.length}<br>${Math.round(Math.abs(c.s)*5)} km/h<br>BOOST ${'&#9646;'.repeat(Math.round(c.boost*8))}${'&#9647;'.repeat(8-Math.round(c.boost*8))}`});
  lbUpd(rk);if(MP&&MP.racing)mpSend();
  if(state=='race'&&hs.every(c=>c.fin)){state='end';finishRace();
    setTimeout(()=>{if(state!='end')return;$('res').innerHTML=rank().map((c,i)=>`<span style="${c.pl?'color:#ffd54a;font-weight:800':''}">${ord[i]} &mdash; ${lab(c)}${c.pl?' &#9664; you':''}</span>`).join('<br>');$('end').style.display='flex'},1500)}}
updMap();refreshMenu();pulse();
frame();
